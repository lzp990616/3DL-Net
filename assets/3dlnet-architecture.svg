<style>text{font-family:Arial,Helvetica,sans-serif}.white{fill:#edf4ff}.muted{fill:#a8b9d1}.cyan{fill:#70e0dd}.purple{fill:#b9baff}</style><text x="44" y="52" class="cyan" font-size="18" font-weight="600">3DL-NET / CONCEPTUAL ARCHITECTURE</text><text x="44" y="96" class="white" font-size="34" font-weight="700">Global context meets local refinement</text><text x="44" y="130" class="muted" font-size="18" font-weight="400">A reading guide to the method. See the paper for the complete architecture.</text><rect x="44" y="192" width="210" height="150" rx="16" fill="#15243a" stroke="#30475f"/><text x="65" y="228" class="cyan" font-size="15" font-weight="600">INPUT</text><text x="65" y="272" class="white" font-size="24" font-weight="700">Medical image</text><text x="65" y="308" class="muted" font-size="17" font-weight="400">RGB in the code</text><path d="M262 266 L292 266" fill="none" stroke="#8bacc6" stroke-width="2" marker-end="url(#arrow)"/><rect x="308" y="180" width="390" height="192" rx="16" fill="#132c3b" stroke="#3a777e"/><text x="332" y="218" class="cyan" font-size="17" font-weight="600">01 / DSNET</text><text x="332" y="258" class="white" font-size="25" font-weight="700">Preliminary segmentation</text><rect x="340" y="303.0" width="34" height="24" rx="5" fill="#70e0dd"/><path d="M377 315 L392 315" fill="none" stroke="#70a0ab" stroke-width="1.5"/><rect x="397" y="295.0" width="34" height="40" rx="5" fill="#45848c"/><path d="M434 315 L449 315" fill="none" stroke="#70a0ab" stroke-width="1.5"/><rect x="454" y="287.0" width="34" height="56" rx="5" fill="#70e0dd"/><path d="M491 315 L506 315" fill="none" stroke="#70a0ab" stroke-width="1.5"/><rect x="511" y="295.0" width="34" height="40" rx="5" fill="#45848c"/><path d="M548 315 L563 315" fill="none" stroke="#70a0ab" stroke-width="1.5"/><rect x="568" y="303.0" width="34" height="24" rx="5" fill="#70e0dd"/><path d="M710 266 L744 266" fill="none" stroke="#8bacc6" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="192" width="396" height="150" rx="16" fill="#1b2445" stroke="#686d9a"/><text x="784" y="228" class="purple" font-size="16" font-weight="600">LOCAL REFINEMENT</text><text x="784" y="270" class="white" font-size="24" font-weight="700">Dendritic neuron module</text><text x="784" y="308" class="muted" font-size="18" font-weight="400">Channel-level feature learning</text><path d="M958 342 V410 H248 V440" fill="none" stroke="#8bacc6" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="455" width="410" height="180" rx="16" fill="#1b2445" stroke="#686d9a"/><text x="68" y="494" class="purple" font-size="17" font-weight="600">02 / DMNET</text><text x="68" y="535" class="white" font-size="27" font-weight="700">Contextual refinement</text><text x="68" y="572" class="muted" font-size="19" font-weight="400">Multi-scale dilated convolutions</text><text x="68" y="605" class="muted" font-size="19" font-weight="400">+ dendritic feature learning</text><path d="M465 545 L509 545" fill="none" stroke="#8bacc6" stroke-width="2" marker-end="url(#arrow)"/><rect x="525" y="475" width="280" height="140" rx="16" fill="#132c3b" stroke="#3a777e"/><text x="548" y="513" class="cyan" font-size="16" font-weight="600">REFINEMENT</text><text x="548" y="551" class="white" font-size="21" font-weight="700">Residual combination</text><text x="548" y="585" class="muted" font-size="17" font-weight="400">Preliminary + refinement</text><path d="M815 545 L857 545" fill="none" stroke="#8bacc6" stroke-width="2" marker-end="url(#arrow)"/><rect x="874" y="475" width="282" height="140" rx="16" fill="#15243a" stroke="#30475f"/><text x="898" y="513" class="cyan" font-size="16" font-weight="600">OUTPUT</text><text x="898" y="552" class="white" font-size="26" font-weight="700">Segmentation</text><text x="898" y="585" class="muted" font-size="18" font-weight="400">Pixel-level prediction</text><path d="M958 342 V390 H665 V462" fill="none" stroke="#8bacc6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="680" y="378" class="muted" font-size="15" font-weight="400">preliminary output</text><path d="M44 684 L1156 684" fill="none" stroke="#30475f" stroke-width="1"/><text x="44" y="723" class="cyan" font-size="16" font-weight="600">TRAINING</text><text x="193" y="723" class="muted" font-size="20" font-weight="400">Deep supervision · auxiliary losses · four-fold evaluation</text><text x="44" y="761" class="muted" font-size="15" font-weight="400">Conceptual view. Blocks are not drawn to scale.</text></svg>
